[project]
name = "mongai"
version = "0.1.0"
description = "門外不出（MonGAI）：学内ローカルLLM基盤「おいとま」上で動く論文の投稿前セルフレビューシステム"
requires-python = ">=3.12,<3.13"

# 依存ライブラリは requirements/*.txt でサービスごとに固定する（docs/dependencies.md も参照）

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 日本語の全角記号（、。（）：）をコメント・文字列で使うため
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
# 日本語は1文字を幅2と数えるため、コメント・文字列を含む行は整形の上限（100）より長めに許す
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# テストの期待値（論文の文など）は1行で書く
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "gateway", "searcher", "shared", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*", "pysbd.*"]
ignore_missing_imports = true

# PyMuPDF は型注釈が不完全なため、呼び出し側でだけ型なしの呼び出しを許す
[[tool.mypy.overrides]]
module = [
    "core.ingest.layout",
    "core.annotate.pdf",
    "core.annotate.locate",
    "core.annotate.check",
    "tests.unit.pdf_factory",
    "tests.unit.test_annotate",
    "tests.unit.test_api_annotated",
    "tests.unit.test_locate",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
    "live_api: おいとまAPIに実際にアクセスするテスト（OITOMA_API_KEY が必要）",
    "integration: GROBID などのコンテナを使う結合テスト（make test-integration）",
]
filterwarnings = [
    # pysbd 0.3.4 の正規表現リテラルが Python 3.12 で出す警告（動作には影響しない）
    "ignore:invalid escape sequence:SyntaxWarning",
]
