# 開発用のモック認証サービス（devauth）への問い合わせ（compose.dev.yaml だけで使う）
location = /_auth {
    internal;
    proxy_pass http://devauth:8000/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}

# セッションの確認はブラウザから直接呼べないようにする
location = /auth/verify {
    return 404;
}

# ログイン・ログアウト（/auth/dev-login?user=alice、/auth/dev-logout）
location /auth/ {
    proxy_pass http://devauth:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
