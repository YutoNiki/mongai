# 認証サービス（authn。Google の OpenID Connect）への問い合わせ（本番相当の compose.yaml）。
# 開発用の構成では compose.dev.yaml が docker/web/auth/dev/ の設定に差し替える。

# /api/ の要求ごとに、本文を渡さずにセッションを確かめる（Cookie などのヘッダーだけを渡す）
location = /_auth {
    internal;
    proxy_pass http://authn:8000/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-MongAI-Assertion "";
}

# セッションの確認はブラウザから直接呼べないようにする
location = /auth/verify {
    return 404;
}

# Google から戻るところ。URL に認可コードが含まれるので、アクセスログに残さない
location = /auth/callback {
    access_log off;
    limit_except GET { deny all; }
    client_max_body_size 1k;
    proxy_pass http://authn:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-MongAI-Assertion "";
}

# ログイン・ログアウト（論文などの本文は渡さない。本文の大きさを 1KB に制限する）。
# Host はポート番号を含めて渡す（authn が設定のオリジンと比べる。$host はポート番号を含まない）
location /auth/ {
    limit_except GET POST { deny all; }
    client_max_body_size 1k;
    proxy_pass http://authn:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-MongAI-Assertion "";
}
