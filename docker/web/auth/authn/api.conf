# 要求のたびに authn に問い合わせ、その応答の主張だけを core に渡す（ブラウザから来た同名のヘッダーは上書きする）。
# authn が 401 を返したら 401（ゲストにしない）。authn に問い合わせられなければ 503（フェイルクローズ）
auth_request /_auth;
auth_request_set $mongai_assertion $upstream_http_x_mongai_assertion;
proxy_set_header X-MongAI-Assertion $mongai_assertion;
error_page 401 = @mongai_invalid_session;
error_page 500 = @mongai_auth_unavailable;
