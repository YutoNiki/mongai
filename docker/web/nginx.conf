# web（nginx）の設定。外部CDNを使わないことを CSP でも強制する（SPEC 2.5）。

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 100m;

    # 圧縮して送る（画面の JS・CSS は圧縮すると約3分の1になる）。PDF は既に圧縮されているので対象外
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json
               application/wasm image/svg+xml text/plain;

    # 'wasm-unsafe-eval' は PDF.js の WebAssembly（画像のデコーダ等、自分のサーバーから配信）のため。
    # 外部のスクリプト・フォント・通信は許可しない
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # 認証サービスへの問い合わせ（本番相当は何もしない。開発用の構成は devauth に問い合わせる）
    include /etc/nginx/mongai-auth/server.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/mongai-auth/api.conf;
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # ファイル名の変わらないもの（index.html・アイコン等）は、毎回更新を確かめさせる
        expires -1;
    }
    # Vite がファイル名にハッシュを付けたもの（中身が変わると名前も変わる）は長くキャッシュしてよい
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    # PDF.js のワーカー（.mjs）と WebAssembly を正しい種類で返す
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        types { application/javascript mjs; }
    }
    # PWA のマニフェストと Service Worker（Service Worker は更新がすぐ届くようキャッシュさせない）
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        expires -1;
        types { application/manifest+json webmanifest; }
    }
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~ \.wasm$ {
        root /usr/share/nginx/html;
        types { application/wasm wasm; }
    }
}
