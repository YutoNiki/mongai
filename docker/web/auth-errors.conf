# 認証の結果を JSON で返す（本番の authn・開発用の devauth で共通。画面がログインの案内を出すのに使う）。
# auth/*/api.conf の error_page から使う。
# 401：Cookie はあるが無効・期限切れ（ゲストにしない）。500：認証サービスに問い合わせられない（認証済みにもゲストにもしない）
location @mongai_invalid_session {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"detail":"invalid_session"}';
}
location @mongai_auth_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"auth_unavailable"}';
}
