# 役割ごとのモデル割り当て（SPEC 5.3）。コードにモデルIDを直書きせず、ここで管理する。
# 精度は M9 の評価ハーネス（make eval）で検証して差し替える前提。
#
# thinking：思考モードの on/off（null はモデルの既定のまま）。
#   おいとまでの指定方法は docs/oitoma_api.md を参照（make check-api で確認）。
# max_tokens：出力の上限。入力と合わせて context_window を超えないよう core/llm で調整する。

context_window: 32768

# API の挙動に関する設定。make check-api の結果を見て切り替える（docs/oitoma_api.md）。
api:
  # JSON出力の強制方法：json_schema | json_object | none（none はプロンプト指示＋検証＋リトライのみ）
  # 2026-10-12 の make check-api で json_schema が動くことを確認
  json_mode: json_schema
  # 思考モードの切り替え方法：chat_template_kwargs（vLLM 形式の enable_thinking）| none（切り替えない）
  # 2026-10-12 確認：qwen3.8-27b-it は既定で思考オフ。enable_thinking: true で思考し、内容は message.reasoning に入る
  thinking_param: chat_template_kwargs
  # 1本の生成は毎秒約28トークン（2026-10-13 の make bench-concurrency）。思考を含めて
  # max_tokens（16384）まで出し切れるよう長めにする。300秒では打ち切りと送り直しが続いた
  timeout_seconds: 900
  max_retries: 4
  # 同時リクエスト数の上限（おいとまは負荷制限なし。クライアント側の資源保護のため）
  max_concurrency: 32
  # 出力トークンの既定上限
  default_max_tokens: 4096

roles:
  structure_extraction: {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false}
  rule_extraction:      {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false, max_tokens: 8192}
  reference_extraction: {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false}  # GROBID が失敗した場合の参考文献の構造化
  # early_stop：最初の2回が一致すれば3回目を送らない（残る指摘は3回の多数決と同じ）
  logic_check:          {model: qwen3.8-27b-it, temperature: 0.2, samples: 3, vote: majority, early_stop: true, thinking: true, max_tokens: 16384}
  rule_check:           {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false}
  lab_extraction:       {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false, max_tokens: 8192}  # 研究室知識の取り込み
  lab_check:            {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false}  # 過去の指摘に類似する箇所の判定
  citation_support:     {model: qwen3.8-27b-it, temperature: 0.0, thinking: true, max_tokens: 8192}
  suggestion:           {model: qwen3.8-27b-it, temperature: 0.4, thinking: true, max_tokens: 12288}
  second_opinion:       {model: Ternary-Bonsai-2-27B, temperature: 0.0}
  searcher_match:       {model: qwen3.6-35b-a3b-it, temperature: 0.0, thinking: false}

embeddings:
  retrieval:  {model: qwen3-embedding-8b}   # ルール・先行研究・研究室知識
  # ゲートウェイの類似度判定。SPEC の初期値は multilingual-e5 だが、2026-10-12 時点で
  # おいとま側に実体がなく 502 になるため、暫定で gte-qwen2-7b-it を使う（TODO.md 保留事項）
  leak_check: {model: gte-qwen2-7b-it}
